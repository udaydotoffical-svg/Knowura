plugins {
    id 'com.android.application'
}

// Release signing material is deliberately external to this repository. Set all of:
// ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
def signingEnv = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def signingConfigured = signingEnv.values().every { it != null && !it.trim().isEmpty() }

tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Ensures external Android release-signing inputs are present and usable.'
    doLast {
        def missing = signingEnv.findAll { name, value -> value == null || value.trim().isEmpty() }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is not configured. Supply: ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (missing: ${missing.join(', ')}).")
        }
        def keystore = new File(signingEnv.storeFile)
        if (!keystore.isFile()) {
            throw new GradleException("ANDROID_KEYSTORE_PATH does not point to a readable keystore file: ${keystore}")
        }
        if (!keystore.canRead()) {
            throw new GradleException("The keystore at ANDROID_KEYSTORE_PATH is not readable: ${keystore}")
        }
    }
}

android {
    namespace 'com.knowura.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.knowura.app'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '1.9.3'
    }

    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile new File(signingEnv.storeFile)
                storePassword signingEnv.storePassword
                keyAlias signingEnv.keyAlias
                keyPassword signingEnv.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigured) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Guard the public release entry points, while leaving debug/development builds usable without keys.
tasks.configureEach { task ->
    if (task.name == 'assembleRelease' || task.name == 'bundleRelease' ||
            (task.name.startsWith('package') && task.name.endsWith('Release'))) {
        task.dependsOn(tasks.named('validateReleaseSigning'))
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
