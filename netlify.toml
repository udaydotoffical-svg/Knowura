[build]
  command = "npm run build"
  publish = "public"
  functions = "functions"

[build.environment]
  # GOOGLE_CLIENT_ID isn't a secret — OAuth client IDs are meant to be public
  # and are intentionally embedded in public/index.html (data-client_id) for
  # Google Identity Services. Netlify's scanner can't tell public IDs from
  # real secrets, so it flags the env var matching that hardcoded value.
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_ID"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"

# The global CSP is applied per page (not /*) so /preview can carry its own, looser, sandboxed one.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' data: blob:; connect-src 'self' https://accounts.google.com/gsi/; frame-src 'self' https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://uday3ebsite.vercel.app https://udaysingh.vercel.app; upgrade-insecure-requests"

