name: Build Windows app

# Packages desktop/ (Electron) into a Windows installer and a portable .exe. Run it from the Actions tab
# (or push a tag like desktop-1) and download the files from the Releases page.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js

      - name: Package for Windows
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Knowura-desktop
          path: |
            desktop/dist/Knowura-Desktop-Setup-*.exe
            desktop/dist/Knowura-Desktop-Portable-*.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/Knowura-Desktop-Setup-*.exe dist/Knowura-Desktop-Portable-*.exe \
            --title "Knowura for Windows #${GITHUB_RUN_NUMBER}" \
            --notes "Knowura assistant for Windows. Setup installs per user (no admin); Portable runs from anywhere. Pop it up with Alt+Space (or Ctrl+Alt+K). Windows may show a SmartScreen warning because the app is not code-signed: choose More info, then Run anyway." \
            --target "${GITHUB_SHA}"
