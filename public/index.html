    // ─── TIPS BAR (rotates every 30s, replaces the old Netlify attribution line) ──

    const TIPS = [

    initTips();

    // ─── LIVE VOICE MODE (Groq Whisper STT + Orpheus TTS) ───────────────────

    // Your gif art — one loop per avatar state. "ultra" always overrides the others while active.
    const ORB_GIFS = {
        idle: 'assets/images/bloub-cercle-neutre-bleu.gif',
        listening: 'assets/images/bloub-cercle-attentif-bleu.gif',
        thinking: 'assets/images/bloub-circle-starting-ai.gif',
        speaking: 'assets/images/bloub-cercle-attentif-bleu.gif',
        ultra: 'assets/images/bloub-ultra-thinking-mode.gif'
    };
    let currentOrbState = 'idle';
    let audioCtx = null;
    let currentReplyAudio = null;

    function setOrbState(state) {
        currentOrbState = state;
        const orb = document.getElementById('liveOrb');
        const wrap = document.getElementById('orbWrap');
        if (!orb) return;
        const gif = ultraThinkMode ? ORB_GIFS.ultra : (ORB_GIFS[state] || ORB_GIFS.idle);
        if (!orb.src.endsWith(gif)) orb.src = gif;
        if (wrap) wrap.classList.toggle('listening', state === 'listening');
    }

    function setLiveStatus(text) {
        const el = document.getElementById('liveStatus');
        if (el) el.innerText = text;
    }

    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    async function transcribeBlob(blob) {
        const base64 = await blobToBase64(blob);
        const res = await fetch("/.netlify/functions/transcribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ audio: base64, mimeType: blob.type })
        });
        const data = await res.json();
        return (data.text || '').trim();
    }

    // ─── LIVE CALL (hands-free — auto-listens, auto-detects when you stop talking) ────
    // Voice-activity detection watches mic volume: speech above VAD_SPEECH_RMS starts a
    // capture, VAD_SILENCE_MS of quiet ends it and sends it off. No push-to-talk needed.

    const VAD_SPEECH_RMS = 0.025;
    const VAD_SILENCE_MS = 900;
    const VAD_MAX_CAPTURE_MS = 20000;
    const VAD_MIN_BYTES = 3000; // discard near-empty captures (mic bumps, false triggers)

    let callActive = false;
    let callMuted = false;
    let callState = 'idle'; // 'listening' | 'capturing' | 'processing' | 'speaking'
    let vadStream = null, vadCtx = null, vadAnalyser = null, vadData = null, vadRAF = null;
    let callRecorder = null, callChunks = [];
    let silenceTimer = null, maxCaptureTimer = null;

    async function openLivePanel() {
        document.getElementById('livePanel').classList.add('open');
        syncUltraToggles();
        await startCall();
        applyWakeWordSetting();
    }

    function closeLivePanel() {
        endCall();
        document.getElementById('livePanel').classList.remove('open');
        applyWakeWordSetting();
    }

    async function startCall() {
        if (callActive) return;
        setLiveStatus('Connecting…');
        try {
            vadStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
        } catch (e) {
            showAlert("Microphone access is required for Live Mode.", "Microphone needed");
            closeLivePanel();
            return;
        }
        callActive = true;
        callMuted = false;
        updateCallControlsUI();

        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(vadStream);
        vadAnalyser = audioCtx.createAnalyser();
        vadAnalyser.fftSize = 512;
        src.connect(vadAnalyser);
        vadData = new Uint8Array(vadAnalyser.frequencyBinCount);

        enterListeningState();
        if (settings.voiceMode === 'seamless') vadLoop();
    }

    // ─── PUSH TO TALK (used instead of the auto-listening VAD loop when settings.voiceMode === 'ptt') ──

    function pttStart(e) {
        e.preventDefault();
        if (!callActive || callMuted || callState === 'processing' || callState === 'speaking') return;
        document.getElementById('pttBtn')?.classList.add('holding');
        beginCapture();
    }

    function pttStop(e) {
        e.preventDefault();
        document.getElementById('pttBtn')?.classList.remove('holding');
        if (callState === 'capturing') finishCapture();
    }

    function endCall() {
        callActive = false;
        callState = 'idle';
        callMuted = false;
        if (vadRAF) cancelAnimationFrame(vadRAF);
        vadRAF = null;
        clearTimeout(silenceTimer); silenceTimer = null;
        clearTimeout(maxCaptureTimer); maxCaptureTimer = null;
        if (callRecorder && callRecorder.state !== 'inactive') {
            callRecorder.onstop = null;
            try { callRecorder.stop(); } catch (e) { /* already stopped */ }
        }
        if (vadStream) { vadStream.getTracks().forEach(t => t.stop()); vadStream = null; }
        if (currentReplyAudio) { currentReplyAudio.pause(); currentReplyAudio = null; }
        document.getElementById('pttBtn')?.classList.remove('holding');
        setOrbState('idle');
        setLiveStatus('Call ended');
    }

    function enterListeningState() {
        if (!callActive) return;
        callState = 'listening';
        setOrbState('idle');
        setLiveStatus(callMuted ? 'Muted' : 'Listening…');
        document.getElementById('liveTranscript').innerText = '';
    }

    function toggleMute() {
        callMuted = !callMuted;
        updateCallControlsUI();
        if (callMuted) {
            if (callState === 'capturing') {
                clearTimeout(silenceTimer); silenceTimer = null;
                clearTimeout(maxCaptureTimer); maxCaptureTimer = null;
                if (callRecorder && callRecorder.state !== 'inactive') callRecorder.stop();
            }
            setLiveStatus('Muted');
        } else if (callState === 'listening' || callState === 'capturing') {
            enterListeningState();
        }
    }

    function updateCallControlsUI() {
        const muteBtn = document.getElementById('muteBtn');
        const pttBtn = document.getElementById('pttBtn');
        if (!muteBtn || !pttBtn) return;
        const isPTT = settings.voiceMode === 'ptt';
        muteBtn.style.display = isPTT ? 'none' : 'flex';
        pttBtn.style.display = isPTT ? 'flex' : 'none';
        muteBtn.classList.toggle('muted', callMuted);
        muteBtn.innerHTML = callMuted
            ? '<svg class="icon"><use href="#icon-mic-off"/></svg>'
            : '<svg class="icon"><use href="#icon-mic"/></svg>';
        muteBtn.title = callMuted ? 'Unmute microphone' : 'Mute microphone';
    }

    function vadLoop() {
        if (!callActive) return;
        vadRAF = requestAnimationFrame(vadLoop);
        if (callMuted || callState === 'processing' || callState === 'speaking') return;

        vadAnalyser.getByteTimeDomainData(vadData);
        let sumSquares = 0;
        for (let i = 0; i < vadData.length; i++) {
            const v = (vadData[i] - 128) / 128;
            sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / vadData.length);

        if (callState === 'listening' && rms > VAD_SPEECH_RMS) {
            beginCapture();
        } else if (callState === 'capturing') {
            if (rms > VAD_SPEECH_RMS) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
            } else if (!silenceTimer) {
                silenceTimer = setTimeout(finishCapture, VAD_SILENCE_MS);
            }
        }
    }

    function beginCapture() {
        callState = 'capturing';
        setOrbState('listening');
        setLiveStatus('Listening…');
        callChunks = [];
        callRecorder = new MediaRecorder(vadStream);
        callRecorder.ondataavailable = (e) => { if (e.data.size > 0) callChunks.push(e.data); };
        callRecorder.onstop = onCaptureStop;
        callRecorder.start();
        maxCaptureTimer = setTimeout(finishCapture, VAD_MAX_CAPTURE_MS);
    }

    function finishCapture() {
        if (callState !== 'capturing') return;
        clearTimeout(silenceTimer); silenceTimer = null;
        clearTimeout(maxCaptureTimer); maxCaptureTimer = null;
        if (callRecorder && callRecorder.state !== 'inactive') callRecorder.stop();
    }

    async function onCaptureStop() {
        if (!callActive || callMuted) { enterListeningState(); return; }
        const blob = new Blob(callChunks, { type: callRecorder.mimeType || 'audio/webm' });
        if (blob.size < VAD_MIN_BYTES) { enterListeningState(); return; }

        callState = 'processing';
        setOrbState('thinking');
        setLiveStatus(ultraThinkMode ? 'Ultra thinking…' : 'Thinking…');
        try {
            const text = await transcribeBlob(blob);
            if (!callActive) return;
            if (!text) { enterListeningState(); return; }
            document.getElementById('liveTranscript').innerText = text;
            await ask(text, { speak: true, fromVoice: true });
        } catch (e) {
            console.error('Transcription failed:', e);
            if (callActive) { setLiveStatus('Something went wrong'); enterListeningState(); }
        }
    }

    async function speakReply(text) {
        callState = 'speaking';
        setOrbState('thinking');
        setLiveStatus('Generating voice…');
        try {
            const res = await fetch("/.netlify/functions/speak", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });
            const raw = await res.text();
            let data;
            try { data = JSON.parse(raw); }
            catch (e) { throw new Error(`Non-JSON response from /speak (HTTP ${res.status}): ${raw.slice(0, 300)}`); }
            if (!data.audio) throw new Error(data.error || `No audio returned (HTTP ${res.status})`);

            currentReplyAudio = new Audio(`data:${data.mimeType || 'audio/wav'};base64,${data.audio}`);
            setOrbState('speaking');
            setLiveStatus('Speaking…');
            hookAnalyser(currentReplyAudio);
            currentReplyAudio.onended = () => {
                currentReplyAudio = null;
                if (callActive) enterListeningState(); else setOrbState('idle');
            };
            await currentReplyAudio.play();
        } catch (e) {
            console.warn('TTS failed:', e);
            setOrbState('idle');
            setLiveStatus("Couldn't generate voice — check console for details");
            setTimeout(() => { if (callActive) enterListeningState(); }, 2200);
        }
    }

    function hookAnalyser(audioEl) {
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audioEl);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            const data = new Uint8Array(analyser.frequencyBinCount);
            const orb = document.getElementById('liveOrb');

            function tick() {
                if (audioEl.paused || audioEl.ended) { if (orb) orb.style.transform = ''; return; }
                analyser.getByteFrequencyData(data);
                const avg = data.reduce((a, b) => a + b, 0) / data.length;
                const scale = 1 + Math.min(0.09, avg / 1300);
                if (orb) orb.style.transform = `scale(${scale.toFixed(3)})`;
                requestAnimationFrame(tick);
            }
            tick();
        } catch (e) {
            // Analyser is a visual nicety only — playback still works without it.
            console.warn('Audio analyser unavailable:', e);
        }
    }

    // ─── SMART SEND BUTTON (morphs into a mic when the input is empty; the mic IS the Live Mode trigger) ──

    function playMorph(el) {
        el.classList.remove('morph');
        void el.offsetWidth; // force reflow so the animation can replay
        el.classList.add('morph');
    }

    function updateSendBtnUI() {
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');
        const hasText = input.value.trim().length > 0;
        const wasMic = btn.classList.contains('mic-mode');

        if (hasText) {
            btn.classList.remove('mic-mode');
            btn.innerHTML = 'Send <svg class="icon"><use href="#icon-arrow-right"/></svg>';
            btn.title = 'Send message';
            if (wasMic) playMorph(btn);
        } else {
            btn.classList.add('mic-mode');
            btn.innerHTML = '<svg class="icon"><use href="#icon-mic"/></svg>';
            btn.title = 'Talk to Knowura live';
            if (!wasMic) playMorph(btn);
        }
    }

    function handleSendClick() {
        const input = document.getElementById('userInput');
        if (input.value.trim().length > 0) {
            ask();
        } else {
            openLivePanel();
        }
    }

    document.getElementById('userInput').addEventListener('input', updateSendBtnUI);
    updateSendBtnUI();

    document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(); });
    document.getElementById('ownerPasswordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') unlockWithPassword(); });
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        closeOwnerModal();
        if (document.getElementById('appDialog').classList.contains('open')) dialogCancel();
    });

    // ─── MOBILE DETECTION & KEYBOARD HANDLING ──────────────────────────────────
    // 100dvh (in the CSS above) + interactive-widget=resizes-content (meta viewport)
    // handle most of the "keyboard covers the input" problem on modern mobile
    // browsers on their own. This just tags the page for CSS/JS hooks and nudges
    // the input above the keyboard on browsers that don't resize the layout.

    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    const isMobileUA = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isTouchDevice || isMobileUA) document.documentElement.classList.add('is-touch');
    if (isMobileUA) document.documentElement.classList.add('is-mobile');

    document.getElementById('userInput').addEventListener('focus', () => {
        if (!document.documentElement.classList.contains('is-mobile')) return;
        setTimeout(() => {
            document.getElementById('userInput').scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 300); // let the keyboard finish animating in first
    });

    // ─── SHRINKING HEADER (big logo up top, compacts + gains a wordmark on scroll) ──
    // Only applies in "Full Logo" mode (Settings → Header Style) — "Compact" stays small always.
    document.getElementById('chat-box').addEventListener('scroll', (e) => {
        if (settings.logoView === 'normal') return;
        document.querySelector('header').classList.toggle('scrolled', e.target.scrollTop > 12);
    });
</script>
