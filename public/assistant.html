<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Knowura Assistant</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#05070f">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/fonts/geist-pixel.css">
    <!-- the real app UI (colours, bubbles, prompt bar, voice orb, quiz/flashcards), generated from index.html -->
    <link rel="stylesheet" href="/assets/ui/app-ui.css">
    <link rel="stylesheet" href="/assets/attach/attach.css">
    <style>
        html, body { height: 100%; background: transparent; color: var(--text); overflow: hidden; -webkit-tap-highlight-color: transparent; }
        /* in a normal browser tab (no phone screen behind it) give the page its own backdrop */
        body:not(.native) { background: radial-gradient(120% 90% at 50% 0%, #0f2a80 0%, #05070f 60%); }
        [hidden] { display: none !important; }

        .scrim { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(0,0,0,0.72) 100%); animation: kwFade .28s ease both; }
        .stack {
            position: fixed; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 10px; transition: bottom .22s cubic-bezier(.2,.9,.3,1), transform .2s ease, opacity .2s ease;
            padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
        }
        /* ── motion system: real spring easing (set in JS), state-aware orb, live waveform, ripples ── */
        :root { --spring: cubic-bezier(.18,.95,.25,1.08); }
        .stack.enter > * { animation: kwRise .7s var(--spring) both; }
        .stack.enter > *:nth-child(2) { animation-delay: .05s; } .stack.enter > *:nth-child(3) { animation-delay: .1s; }
        .stack.leaving { transform: translateY(54px) scale(.96); opacity: 0; transition: transform .2s cubic-bezier(.5,0,.9,.6), opacity .2s ease; }
        .scrim.leaving { opacity: 0; transition: opacity .2s ease; }
        .scrim { overflow: hidden; }
        .scrim::after { content: ''; position: absolute; left: 50%; bottom: -35%; width: 150%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%) scale(.2); opacity: 0;
            background: radial-gradient(closest-side, rgba(34,229,255,.28), rgba(77,119,255,.12) 55%, transparent 72%); pointer-events: none; }
        .scrim.glow::after { animation: kwGlow 1s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes kwGlow { 0% { transform: translateX(-50%) scale(.2); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(-50%) scale(1); opacity: 0; } }
        .view-in { animation: kwView .5s var(--spring) both; }
        @keyframes kwView { from { opacity: 0; transform: translateY(22px) scale(.95); } to { opacity: 1; transform: none; } }
        .msg { animation: kwMsgL .42s var(--spring) both; transform-origin: 0 100%; }
        .msg.user { animation-name: kwMsgR; transform-origin: 100% 100%; }
        @keyframes kwMsgL { from { opacity: 0; transform: translate(-14px, 10px) scale(.94); } to { opacity: 1; transform: none; } }
        @keyframes kwMsgR { from { opacity: 0; transform: translate(14px, 10px) scale(.94); } to { opacity: 1; transform: none; } }
        .msg.reveal { animation: kwMsgL .42s var(--spring) both, kwReveal .8s cubic-bezier(.2,.8,.2,1) backwards; }   /* backwards: nothing stays clipped once it has played (the avatar sits outside the bubble) */
        @keyframes kwReveal { from { clip-path: inset(-24px -90px 100% -90px); } to { clip-path: inset(-24px -90px -90px -90px); } }

        /* orb: floats, glows in the colour of what it is doing, and shows listening / thinking / speaking differently */
        #voiceView .orb-wrap { animation: kwFloat 5.5s ease-in-out infinite; --glow: rgba(34,229,255,.5); }
        @keyframes kwFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        #voiceView .orb-wrap::before { content: ''; position: absolute; inset: -16%; border-radius: 50%; pointer-events: none;
            background: radial-gradient(closest-side, var(--glow), transparent 72%); animation: kwBreathe 4s ease-in-out infinite; transition: background .6s ease; }
        @keyframes kwBreathe { 0%, 100% { transform: scale(.9); opacity: .45; } 50% { transform: scale(1.1); opacity: .8; } }
        #voiceView .orb-wrap.listening { --glow: rgba(34,229,255,.65); }
        #voiceView .orb-wrap.thinking { --glow: rgba(160,120,255,.65); }
        #voiceView .orb-wrap.speaking { --glow: rgba(255,100,160,.6); }
        #voiceView .orb-wrap.thinking::after { content: ''; position: absolute; inset: 4%; border-radius: 50%; border: 3px solid transparent; border-top-color: rgba(200,170,255,.95); border-right-color: rgba(200,170,255,.3); animation: kwSpin .85s linear infinite; pointer-events: none; }
        #voiceView .orb-wrap.speaking .ring { border-color: #ff6aa8; }
        #voiceView .orb-wrap.speaking .ring1 { animation: ringPulse 1.5s ease-out infinite; }
        #voiceView .orb-wrap.speaking .ring2 { animation: ringPulse 1.5s ease-out infinite .5s; }
        #voiceView .orb-wrap.thinking .ring { border-color: #a678ff; }

        /* live waveform under the orb: bars follow your voice while listening, ripple while it speaks, bounce while it thinks */
        .bars { position: relative; z-index: 1; display: flex; gap: 5px; align-items: center; justify-content: center; height: 30px; opacity: 0; transition: opacity .35s ease; }
        .bars i { width: 5px; height: 100%; border-radius: 99px; background: linear-gradient(#22e5ff, #4d77ff); transform: scaleY(.14); transform-origin: center; transition: transform .09s linear, background .4s ease; }
        #voiceView[data-state="listening"] .bars, #voiceView[data-state="speaking"] .bars, #voiceView[data-state="thinking"] .bars { opacity: 1; }
        #voiceView[data-state="listening"] .bars i { transform: scaleY(calc(.14 + var(--lvl, 0) * var(--k, 1))); }
        #voiceView[data-state="speaking"] .bars i { background: linear-gradient(#ff6aa8, #ff9a6a); animation: kwWave 1s ease-in-out infinite; animation-delay: calc(var(--i) * -.11s); transition: none; }
        #voiceView[data-state="thinking"] .bars i { background: linear-gradient(#b99bff, #7a5cff); animation: kwDot 1.1s ease-in-out infinite; animation-delay: calc(var(--i) * -.09s); transition: none; }
        @keyframes kwWave { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(calc(.35 + var(--k, 1) * .55)); } }
        @keyframes kwDot { 0%, 100% { transform: scaleY(.14); opacity: .5; } 50% { transform: scaleY(.5); opacity: 1; } }

        #voiceView .call-controls .mic-btn { transition: transform .25s var(--spring), box-shadow .15s ease, background .2s ease, color .2s ease; }
        #voiceView .call-controls .mic-btn:active { transform: scale(.9); }
        .mic-card { animation: kwView .5s var(--spring) both, kwEdge 2.4s ease-in-out infinite .5s; }
        @keyframes kwEdge { 0%, 100% { box-shadow: 0 0 22px -8px rgba(34,229,255,.4); } 50% { box-shadow: 0 0 36px -4px rgba(34,229,255,.85); } }
        .live-status.pop-text { animation: kwText .3s ease-out both; }
        @keyframes kwText { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes kwRise { from { opacity: 0; transform: translateY(60px) scale(.95); } to { opacity: 1; transform: none; } }
        @keyframes kwFade { from { opacity: 0; } to { opacity: 1; } }

        /* tap ripple on every button */
        .rippler { overflow: hidden; }
        .rip { position: absolute; border-radius: 50%; background: rgba(255,255,255,.38); transform: scale(0); animation: kwRip .6s ease-out forwards; pointer-events: none; }
        @keyframes kwRip { to { transform: scale(1); opacity: 0; } }
        .pb-send.fly .pb-glyph { animation: kwFly .42s cubic-bezier(.4,0,.2,1); }
        @keyframes kwFly { 0% { transform: none; } 45% { transform: translateY(-16px) scale(.8); opacity: 0; } 55% { transform: translateY(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
        .msg-actions button.done svg { animation: kwPop .45s var(--spring); color: #5dffa6; }
        @keyframes kwPop { 0% { transform: scale(.4) rotate(-20deg); } 100% { transform: none; } }
        .chip {
            align-self: flex-end; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer;
            border: 2.5px solid var(--ink); border-radius: 999px; color: var(--text);
            font-size: 14px; font-weight: 700; box-shadow: var(--shadow-sm); backdrop-filter: none;
            background: #0d1a3a;
        }
        .chip svg { width: 16px; height: 16px; }
        .chip:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

        /* ── voice mode: solid, deep panel with a neon edge; the orb breathes with your voice ── */
        #voiceView.live-panel {
            position: relative; inset: auto; z-index: 1; height: min(68vh, 560px); padding: 16px; overflow: hidden;
            border: 3px solid var(--ink); border-radius: 26px; box-shadow: var(--shadow-lg), 0 0 0 1px rgba(34,229,255,.18), 0 0 46px -8px rgba(34,229,255,.35);
            backdrop-filter: none; -webkit-backdrop-filter: none;
            background: radial-gradient(80% 55% at 50% 38%, rgba(34,229,255,.16), transparent 70%), linear-gradient(180deg, #060b1c, #03060f);
        }
        #voiceView.live-panel::before { /* slow aurora behind the orb */
            content: ''; position: absolute; inset: -40%; background: conic-gradient(from 0deg at 50% 45%, rgba(34,229,255,.0), rgba(77,119,255,.22), rgba(255,48,87,.10), rgba(34,229,255,.0) 70%);
            animation: kwSpin 14s linear infinite; pointer-events: none; opacity: .8;
        }
        @keyframes kwSpin { to { transform: rotate(360deg); } }
        #voiceView > :not(.live-close):not(.acct-voice) { position: relative; }
        #voiceView .orb-gif { width: min(60vw, 33vh, 280px); height: min(60vw, 33vh, 280px); transform: scale(calc(1 + var(--lvl, 0) * .22)); transition: transform .08s linear; }
        #voiceView .orb-wrap.listening .ring { transform: scale(calc(1 + var(--lvl, 0) * .35)); }
        #voiceView.live-panel { justify-content: center; }
        #voiceView .call-controls { gap: 16px; margin-top: 6px; }
        #voiceView .live-transcript { max-width: 92%; max-height: 4.5em; overflow: hidden; }
        #voiceView .live-close { top: 14px; right: 14px; display: grid; place-items: center; }
        #voiceView .live-close svg { width: 18px; height: 18px; }
        .acct-voice { position: absolute; top: 14px; left: 14px; }
        .mic-card {
            position: relative; z-index: 2; display: grid; gap: 10px; justify-items: center; text-align: center; max-width: 92%;
            padding: 14px 16px; border: 2.5px solid var(--cyan); border-radius: 18px; background: #08142f; box-shadow: 0 0 28px -6px rgba(34,229,255,.55);
        }
        .mic-card p { font-size: 13px; line-height: 1.5; color: var(--text-dim); }
        .mic-card .btn-ui { justify-content: center; }
        .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .suggest button { border: 2px solid var(--ink); border-radius: 999px; background: #0d1a3a; color: var(--text); font-size: 13px; font-weight: 700; padding: 7px 12px; cursor: pointer; box-shadow: var(--shadow-sm); }
        .suggest button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

        /* ── text chat: a solid sheet holding the app's own message bubbles ── */
        .sheet {
            background: linear-gradient(180deg, #0b1633, #070d22); border: 3px solid var(--ink); border-radius: 26px; box-shadow: var(--shadow-lg), 0 0 40px -10px rgba(77,119,255,.4);
            display: flex; flex-direction: column; max-height: var(--sheetMax, 60vh); overflow: hidden; touch-action: pan-y; transition: max-height .22s cubic-bezier(.2,.9,.3,1);
        }
        .sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 10px 0; flex: none; }
        .sheet-head .left { justify-self: start; } .sheet-head .right { justify-self: end; }
        .grab-zone { padding: 10px 28px 12px; cursor: grab; touch-action: none; }
        .grab { width: 54px; height: 6px; border-radius: 99px; background: linear-gradient(90deg, #22e5ff, #4d77ff); opacity: .8; }
        .sheet .btn-ui { padding: 6px 10px; font-size: 11px; }
        .sheet .btn-ui svg { width: 16px; height: 16px; }
        .acct-img { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); object-fit: cover; }
        #chat-box { flex: 1; min-height: 0; padding: 6px 14px 12px; gap: 12px; padding-top: 6px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .msg { font-size: 15px; }
        .greet small { display: block; margin-top: 8px; color: var(--text-dim); font-size: 13px; line-height: 1.5; }
        .msg.err { color: #ff8da1; }
        .msg-actions { display: flex; gap: 4px; margin: -4px 0 0 34px; }
        .msg-actions button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; color: var(--text-dim); border-radius: 12px; cursor: pointer; }
        .msg-actions button svg { width: 20px; height: 20px; }
        .msg-actions button:active, .msg-actions button.on { background: rgba(34,229,255,0.16); color: var(--cyan); }
        .cta { margin-top: 10px; }

        .input-area { padding: 0; background: none; }
        /* the app's prompt bar is liquid glass; in the panel it is a solid, slightly tinted bar so text stays crisp over any app */
        .prompt-glow { background: linear-gradient(135deg, #12224a, #0a1330) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
        .pb-input::placeholder { color: #8fa6cc; opacity: 1; }
        .acct-pop {
            position: absolute; right: 8px; top: 52px; z-index: 5; min-width: 200px; padding: 12px; border: 2.5px solid var(--ink);
            border-radius: 14px; background: #0d1a3a; box-shadow: var(--shadow-md); display: grid; gap: 8px; font-size: 13px;
        }
        .acct-pop b { display: block; } .acct-pop span { color: var(--text-dim); word-break: break-all; }

        /* a quick message that tells you what just happened (copied, shared, couldn't open...) */
        .kb-open #minBtn { display: none; }
        .build-tag { position: fixed; left: 50%; top: calc(4px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 5; font: 600 10px/1 ui-monospace, monospace; color: rgba(143,166,204,.75); letter-spacing: .4px; pointer-events: none; text-shadow: 0 1px 2px #000; }
        .kw-toast {
            position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top)); z-index: 900; max-width: min(92vw, 420px); padding: 11px 16px;
            border: 2.5px solid var(--ink); border-radius: 14px; background: #0d1a3a; color: var(--text); font-size: 14px; font-weight: 700; text-align: center;
            box-shadow: var(--shadow-sm), 0 0 26px -6px rgba(34,229,255,.55); transform: translate(-50%, -150%); transition: transform .5s var(--spring); overflow: hidden; pointer-events: none;
        }
        .kw-toast::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--cyan); transform-origin: left; transform: scaleX(0); }
        .kw-toast.bad::after { background: #ff3057; }
        .kw-toast.show { transform: translate(-50%, 0); }
        .kw-toast.show::after { animation: kwBar 2.2s linear forwards; }
        @keyframes kwBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        .kw-toast.bad { border-color: #ff3057; box-shadow: var(--shadow-sm), 0 0 26px -6px rgba(255,48,87,.6); }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
    </style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="build-tag" id="buildTag" aria-hidden="true"></div>
<div class="kw-toast" id="kwToast" role="status" aria-live="polite"></div>

<div class="stack" id="stack">
    <button type="button" class="chip" id="minBtn" hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg> Minimize</button>

    <!-- VOICE MODE (opens first) -->
    <section id="voiceView" class="live-panel open" aria-label="Voice mode">
        <button type="button" class="live-close" id="voiceX" title="Switch to text chat" aria-label="Switch to text chat"><svg class="icon"><use href="#icon-x"/></svg></button>
        <button type="button" class="btn-ui acct-voice" id="acctVoice" hidden></button>
        <div id="orbWrap" class="orb-wrap">
            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <img id="liveOrb" class="orb-gif" alt="Knowura avatar">
        </div>
        <div id="bars" class="bars" aria-hidden="true"></div>
        <div id="micCard" class="mic-card" hidden>
            <b id="micTitle">Knowura needs your microphone</b>
            <p id="micText">Allow it once and you can just talk. Nothing is recorded until you speak.</p>
            <button type="button" class="btn-ui" id="micAllow"><svg class="icon"><use href="#icon-mic"/></svg> <span id="micBtnText">Allow microphone</span></button>
        </div>
        <div id="liveStatus" class="live-status">Connecting…</div>
        <div id="liveTranscript" class="live-transcript"></div>
        <div class="call-controls">
            <button id="ccBtn" type="button" class="mic-btn cc-btn active" title="Toggle captions">CC</button>
            <button id="muteBtn" type="button" class="mic-btn secondary" title="Mute / unmute microphone"><svg class="icon"><use href="#icon-mic"/></svg></button>
            <button id="endCallBtn" type="button" class="mic-btn end-call" title="End call"><svg class="icon"><use href="#icon-phone"/></svg></button>
        </div>
    </section>

    <!-- TEXT CHAT -->
    <section id="textView" class="sheet" hidden aria-label="Text chat">
        <div class="sheet-head">
            <div class="left"><button type="button" class="btn-ui" id="newBtn" title="New chat" aria-label="New chat"><svg class="icon"><use href="#icon-edit"/></svg></button></div>
            <div class="grab-zone" id="grab" title="Swipe up to open in the app" aria-label="Swipe up to open in the app"><div class="grab"></div></div>
            <div class="right"><button type="button" class="btn-ui" id="acctBtn">Sign in</button></div>
        </div>
        <div id="acctPop" class="acct-pop" hidden></div>
        <div id="chat-box" role="log" aria-live="polite" aria-label="Conversation"></div>
    </section>

    <div class="input-area" id="inputArea" hidden>
        <div class="prompt-bar" id="promptBar">
            <div id="promptGlow" class="aura-glow prompt-glow" style="--aura-radius:22px; --aura-spread:22px;">
                <div class="pb-inner">
                    <div class="pb-field" id="pbField">
                        <div id="attBar" class="att-bar" hidden aria-label="Attachments"></div>
                        <textarea id="userInput" class="pb-input" rows="1" placeholder="Ask Knowura anything" autocomplete="off" aria-label="Prompt" enterkeyhint="send"></textarea>
                        <div class="pb-bar">
                            <button type="button" id="attachBtn" class="pb-pick pb-attach" aria-label="Add attachment" title="Add photos, files or take a picture"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                            <span class="pb-spacer"></span>
                            <button type="button" id="sendBtn" class="pb-send mic-mode" title="Talk to Knowura live" aria-label="Talk to Knowura live">
                                <svg class="pb-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path id="pbGlyphPath" d="M12 4.5L18.5 11L14.25 11L14.25 19.5L9.75 19.5L9.75 11L5.5 11Z"/></svg>
                                <svg class="icon pb-mic" aria-hidden="true"><use href="#icon-mic"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- quiz + flashcard pop-up: same markup as the app -->
<div id="studyOverlay" class="study-overlay" role="dialog" aria-modal="true" aria-labelledby="studyTitle" onclick="if (event.target === this) closeStudy()">
    <div class="study-card">
        <div class="study-top">
            <div>
                <div id="studyKind" class="study-kind">Quiz</div>
                <div id="studyTitle" class="study-title"></div>
            </div>
            <button type="button" class="study-x" onclick="closeStudy()" aria-label="Close" title="Close"><svg class="icon"><use href="#icon-x"/></svg></button>
        </div>
        <div class="study-progress" aria-hidden="true"><i id="studyBar"></i></div>
        <div id="studyBody" class="study-body" aria-live="polite"></div>
    </div>
</div>

<script src="/assets/vendor/marked/marked.umd.js"></script>
<script src="/assets/vendor/dompurify/purify.min.js"></script>
<script>
// helpers the shared study module expects from its host page (same names as in the app)
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function haptic(kind) { try { navigator.vibrate && navigator.vibrate(kind === 'error' ? [20, 40, 20] : 12); } catch (e) { /* not supported */ } }
function showAlert(message) { window.__note && window.__note(message); }
</script>
<script src="/assets/ui/app-ui.js"></script>
<script src="/assets/attach/attach.js"></script>
<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    // a real damped spring as a CSS easing (linear() points); older web views keep the cubic-bezier fallback
    (function () {
        try {
            if (!(window.CSS && CSS.supports && CSS.supports('animation-timing-function', 'linear(0, 1)'))) return;
            const w = 11, z = 0.52, wd = w * Math.sqrt(1 - z * z), N = 44, T = 1.15, pts = [];
            for (let i = 0; i <= N; i++) { const t = i / N * T; pts.push((1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))).toFixed(4)); }
            pts[N] = '1';
            document.documentElement.style.setProperty('--spring', 'linear(' + pts.join(', ') + ')');
        } catch (e) { /* fallback easing stays */ }
    })();
    const setLvl = (v) => $('voiceView').style.setProperty('--lvl', v);
    // waveform bars: taller in the middle; each reads --lvl (listening) or runs its own wave (speaking / thinking)
    (function () {
        const n = 13, bars = $('bars'); let h = '';
        for (let i = 0; i < n; i++) { const k = (0.45 + (1 - Math.abs(i - (n - 1) / 2) / ((n - 1) / 2)) * 1.6).toFixed(2); h += '<i style="--i:' + i + ';--k:' + k + '"></i>'; }
        bars.innerHTML = h;
    })();
    // tap ripple on buttons
    document.addEventListener('pointerdown', (e) => {
        const b = e.target.closest && e.target.closest('button'); if (!b || b.disabled) return;
        b.classList.add('rippler'); if (getComputedStyle(b).position === 'static') b.style.position = 'relative';   // never override absolutely placed buttons
        const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, x = document.createElement('span');
        x.className = 'rip'; x.style.width = x.style.height = d + 'px'; x.style.left = (e.clientX - r.left - d / 2) + 'px'; x.style.top = (e.clientY - r.top - d / 2) + 'px';
        b.appendChild(x); setTimeout(() => x.remove(), 650);
    }, { passive: true });

        const c = call = { stream, ctx, an, data: new Uint8Array(an.frequencyBinCount), state: 'listening', muted: false, rec: null, chunks: [], lastLoud: 0, t0: 0, dead: false };
        $('muteBtn').innerHTML = '<svg class="icon"><use href="#icon-mic"/></svg>'; $('muteBtn').classList.remove('muted');
        $('orbWrap').querySelector('img').src = ORB_INTRO; setTimeout(() => { if (call === c && c.state === 'listening') orb('listening'); }, 1400);
        status('Listening…'); ui('listening');
        c.timer = setInterval(() => tick(c), 50);
    }
    function tick(c) {
        if (c.dead || c.muted || c.state === 'processing' || c.state === 'speaking') return;
        c.an.getByteTimeDomainData(c.data);
        let s = 0; for (let i = 0; i < c.data.length; i++) { const v = (c.data[i] - 128) / 128; s += v * v; }
        const rms = Math.sqrt(s / c.data.length), now = performance.now();
        setLvl(Math.min(1, rms * 6).toFixed(3));
        if (c.state === 'listening') { if (rms > VAD.rms) beginCapture(c); }
        else if (c.state === 'capturing') {
            if (rms > VAD.rms) c.lastLoud = now;
            if (now - c.lastLoud > VAD.silenceMs || now - c.t0 > VAD.maxMs) endCapture(c);
        }
    }
    function beginCapture(c) {
        c.chunks = []; c.t0 = c.lastLoud = performance.now(); c.state = 'capturing'; orb('listening');
        const rec = c.rec = new MediaRecorder(c.stream);
        rec.ondataavailable = (e) => { if (e.data.size) c.chunks.push(e.data); };
        rec.onstop = () => onCaptured(c, rec);
        rec.start();
    }
    function endCapture(c) { try { c.rec.stop(); } catch (e) { /* already stopped */ } }
    async function onCaptured(c, rec, ready) {
        if (c.dead) return;
        const blob = ready || new Blob(c.chunks, { type: rec.mimeType || 'audio/webm' });
        if (blob.size < VAD.minBytes || c.muted) { backToListening(c); return; }
        c.state = 'processing'; status('Thinking…'); orb('thinking');
        try {
            status('Understanding…');
            const r = await post('transcribe', { audio: await blobToB64(blob), mimeType: blob.type, ownerToken, token: tok() });
            const d = await r.json().catch(() => ({}));
            if (c.dead) return;
            if (!r.ok) { const e = new Error(d.error || 'Could not transcribe that.'); e.limit = !!d.limitReached; e.audience = d.audience; throw e; }
            const text = (d.text || '').trim();
            if (!text) { $('liveTranscript').textContent = 'Didn\'t catch that. Try again.'; setTimeout(() => { if (!c.dead) $('liveTranscript').textContent = ''; }, 2500); backToListening(c); return; }
            $('liveTranscript').textContent = '\u201c' + text.slice(0, 120) + '\u201d'; status('Thinking…');
            addBubble(userHTML(text), 'user'); chat.messages.push({ text: userHTML(text), type: 'user' });
            if (chat.messages.length === 1) chat.title = text.slice(0, 40);
            const { reply, study } = await askModel(text, { voice: true });
            finishReply(addBubble('', 'ai'), reply, study);
            if (c.dead) return;
            await speakInCall(c, reply);
        } catch (e) { if (c.dead) return; chat.messages.length && chat.messages[chat.messages.length - 1].type === 'user' && chat.messages.pop(); if (e.blocked) { const u = $('chat-box').querySelectorAll('.msg.user'); if (u.length) u[u.length - 1].remove(); } showError(e); status(e.limit ? 'Limit reached' : 'Something went wrong'); $('liveTranscript').textContent = String(e.message || 'Something went wrong.').slice(0, 140); setTimeout(() => { if (!c.dead) $('liveTranscript').textContent = ''; backToListening(c); }, 4500); return; }
        backToListening(c);
    }
    function backToListening(c) { if (c.dead || call !== c) return; c.state = 'listening'; if (c.native) { try { bridge.micArm(!c.muted); } catch (e) { /* gone */ } } status(c.muted ? 'Muted' : 'Listening…'); orb('listening'); }

    // ── speech out (also used by "read aloud") ──
    function stopSpeaking() { if (speakingAudio) { try { speakingAudio.pause(); } catch (e) { /* gone */ } speakingAudio = null; } $('orbWrap').querySelector('img').style.transform = ''; }
    async function speak(text) {
        try {
            const res = await post('speak', { text, ownerToken, token: tok() });
            const d = await res.json().catch(() => ({}));
            if (!d.audio) throw new Error(d.error || 'No audio returned.');
            const audio = speakingAudio = new Audio('data:' + (d.mimeType || 'audio/wav') + ';base64,' + d.audio);
            await new Promise((ok) => { audio.onended = ok; audio.onerror = ok; audio.play().catch(ok); });
            return audio;
        } catch (e) { return null; } finally { speakingAudio = null; }
    }
    async function speakInCall(c, text) {
        c.state = 'speaking'; status('Generating voice…'); orb('thinking');
        const clean = text.replace(/[*_`#>]/g, '').trim();
        const res = await post('speak', { text: clean, ownerToken, token: tok() }).catch(() => null);
        const d = res ? await res.json().catch(() => ({})) : {};
        if (c.dead) return;
        if (!d.audio) { $('liveTranscript').textContent = clean.slice(0, 160); status('Showing text'); orb('idle'); await new Promise((ok) => setTimeout(ok, 1800)); return; }
        const audio = speakingAudio = new Audio('data:' + (d.mimeType || 'audio/wav') + ';base64,' + d.audio);
        status('Speaking…'); orb('speaking');
        if (captionsOn) playCaptions(clean, audio);
        await new Promise((ok) => { audio.onended = ok; audio.onerror = ok; audio.play().catch(ok); });
        speakingAudio = null; clearTimeout(captionTimer); $('liveTranscript').textContent = '';
    }
    let captionTimer = null;
    function playCaptions(text, audio) {
        clearTimeout(captionTimer);
        const lines = text.split(/(?<=[.!?])\s+/).filter(Boolean), el = $('liveTranscript');
        if (!lines.length) return;
        const words = (s) => s.split(/\s+/).length, total = lines.reduce((n, l) => n + words(l), 0) || 1;
        const ms = () => audio.duration && isFinite(audio.duration) ? audio.duration * 1000 : (total / 2.5) * 1000;
        const show = (i) => { if (i >= lines.length) return; el.textContent = lines[i]; captionTimer = setTimeout(() => show(i + 1), Math.max(900, words(lines[i]) / total * ms())); };
        show(0);
    }
    function endCall() {
        const c = call; if (!c) return;
        call = null; c.dead = true; clearInterval(c.timer); clearTimeout(captionTimer);
        try { if (c.rec && c.rec.state !== 'inactive') { c.rec.onstop = null; c.rec.stop(); } } catch (e) { /* ignore */ }
        if (c.native) { try { bridge.micStop(); } catch (e) { /* gone */ } }
        else { c.stream.getTracks().forEach((t) => t.stop()); c.ctx.close().catch(() => {}); }
        stopSpeaking(); orb('idle'); $('liveTranscript').textContent = ''; setLvl(0);
    }
    $('muteBtn').addEventListener('click', () => {
        const c = call; if (!c) { startCall(false); return; }
        c.muted = !c.muted;
        if (c.native) { try { bridge.micArm(!c.muted && c.state === 'listening'); } catch (e) { /* gone */ } }
        else c.stream.getAudioTracks().forEach((t) => { t.enabled = !c.muted; });
        $('muteBtn').classList.toggle('muted', c.muted);
        $('muteBtn').innerHTML = '<svg class="icon"><use href="#icon-' + (c.muted ? 'mic-off' : 'mic') + '"/></svg>';
        if (c.muted && c.state === 'capturing') endCapture(c);
        status(c.muted ? 'Muted' : c.state === 'listening' ? 'Listening…' : $('liveStatus').textContent);
    });
    $('ccBtn').addEventListener('click', () => { captionsOn = !captionsOn; $('ccBtn').classList.toggle('active', captionsOn); if (!captionsOn) $('liveTranscript').textContent = ''; });
    $('endCallBtn').addEventListener('click', closePanel);
    $('voiceX').addEventListener('click', () => showText(false)); // the cross: leave voice, stay in the assistant as a text chat

    // ── sign in: done once in the Knowura app; this panel picks it up from the server by install id ──
    const installId = bridge && bridge.installId ? bridge.installId() : '';
    let prefs = { assistantModel: '' };
    async function refreshLink() {
        if (!installId) return;
        try {
            const r = await post('device-session', { installId });
            if (!r.ok) return;
            const d = await r.json();
            prefs = d.prefs || prefs;
            if (d.linked && d.token) {
                session = { user: d.profile.given_name, savedAt: Date.now(), sub: d.profile.sub, email: d.profile.email, picture: d.profile.picture, sessionToken: d.token };
                store('knowura_session', session);
            } else { session = {}; store('knowura_session', null); } // signed out in the app -> signed out here
            renderAcct();
        } catch (e) { /* offline: keep what we have */ }
    }
    let linkReady = Promise.resolve();
    function signIn() {
        showText(false);
        const b = addBubble('<p>Sign in on the Knowura app and it shows up here automatically, with your chats.</p>', 'ai');
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-ui cta'; btn.textContent = 'Open Knowura'; btn.onclick = () => openApp('/'); b.appendChild(btn);
    }
    function renderAcct() {
        const label = signedIn() ? (session.picture ? '<img class="acct-img" alt="" src="' + escapeHtml(session.picture) + '" referrerpolicy="no-referrer"> ' : '') + escapeHtml((session.user || 'Account').slice(0, 10)) : 'Sign in';
        for (const b of [$('acctBtn'), $('acctVoice')]) { b.innerHTML = label; b.hidden = false; }
        $('acctPop').hidden = true;
    }
    function acctClick() {
        if (!signedIn()) { signIn(); return; }
        const p = $('acctPop');
        if (!p.hidden) { p.hidden = true; return; }
        p.innerHTML = '<div><b>' + escapeHtml(session.user || 'Signed in') + '</b><span>' + escapeHtml(session.email || '') + '</span></div><span>' + (bridge ? 'Signed in through the Knowura app. Sign out there to sign out here.' : 'Chats here sync to your Knowura account.') + '</span>' + (bridge ? '' : '<button type="button" class="btn-ui" id="signOutBtn">Sign out</button>');
        p.hidden = false;
        if ($('signOutBtn')) $('signOutBtn').onclick = () => { session = {}; store('knowura_session', null); store('knowura_owner_token', null); ownerToken = undefined; renderAcct(); };
    }
    $('acctBtn').addEventListener('click', acctClick);
    $('acctVoice').addEventListener('click', () => { if (!signedIn()) { signIn(); } else { showText(false); acctClick(); } });

    // ── handing the chat over to the full app ──
    function exportChat() {
        if (!chat || !chat.messages.length) return '';
        let list = chat.messages.slice();
        const enc = () => { const j = JSON.stringify({ id: chat.id, title: chat.title, createdAt: chat.createdAt, updatedAt: chat.updatedAt, messages: list }); return btoa(unescape(encodeURIComponent(j))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
        let out = enc();
        while (out.length > 120000 && list.length > 2) { list = list.slice(2); out = enc(); }
        return out;
    }
    async function openAppWithChat() {
        stopSpeaking(); endCall();
        persist();
        if (signedIn()) { try { await Promise.race([cloudUpsert(), new Promise((ok) => setTimeout(ok, 2500))]); } catch (e) { /* the hash below carries the chat anyway */ } }
        const data = exportChat();
        openApp('/' + (data ? '#kwimport=' + data : ''));
    }
    function openApp(path) { if (bridge) bridge.openApp(path); else location.assign(path); }

    // swiping the handle up opens the app with this chat; swiping down minimizes the sheet
    (function () {
        const grab = $('grab'), sheet = $('textView'); let y0 = null, dy = 0;
        grab.addEventListener('pointerdown', (e) => { y0 = e.clientY; dy = 0; sheet.style.transition = 'max-height .22s ease'; try { grab.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } });
        grab.addEventListener('pointermove', (e) => { if (y0 == null) return; dy = e.clientY - y0; sheet.style.transform = 'translateY(' + Math.max(-70, Math.min(dy, 90)) + 'px)'; });
        const end = () => { if (y0 == null) return; const d = dy; y0 = null; sheet.style.transition = 'transform .6s var(--spring), max-height .22s ease'; sheet.style.transform = ''; setTimeout(() => { sheet.style.transition = ''; }, 650); if (d < -55) openAppWithChat(); else if (d > 70) minimize(); };
        grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
    })();
    function minimize() {
        stopSpeaking();
        if (canBubble) { endCall(); persist(); bridge.minimize(); return; }   // floating bubble over other apps
        $('textView').hidden = true; $('minBtn').hidden = true;
    }
    $('minBtn').addEventListener('click', minimize);
    $('newBtn').addEventListener('click', () => { newChat(); $('userInput').focus(); });
    $('scrim').addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('studyOverlay').classList.contains('open')) closePanel(); });
    $('userInput').addEventListener('focus', () => { if ($('textView').hidden) { $('textView').hidden = false; $('minBtn').hidden = false; } });

    // Keyboard: the panel is a popup that shrinks to the room left above the keyboard (like Gemini's), instead of
    // sliding up the screen. The window resizes for the keyboard, so nothing is shifted; the chat just gets shorter
    // and scrolls. If a phone overlays the keyboard instead of resizing, the gap is measured and the panel sits on it.
    function fit() {
        const v = window.visualViewport, h = v ? v.height : window.innerHeight, top = v ? v.offsetTop : 0;
        const kb = Math.max(0, window.innerHeight - h - top);
        $('stack').style.bottom = kb + 'px';
        const typing = document.activeElement === $('userInput');   // the keyboard is up while the prompt box has focus
        document.body.classList.toggle('kb-open', typing || kb > 80);
        const pad = 12 + 14, gaps = 20, topRoom = 20;
        const used = pad + gaps + $('inputArea').offsetHeight + ($('minBtn').hidden || document.body.classList.contains('kb-open') ? 0 : $('minBtn').offsetHeight);
        const room = Math.max(150, h - topRoom - used - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0));
        const normal = Math.min(window.innerHeight * 0.6, 520);
        $('textView').style.setProperty('--sheetMax', Math.floor(typing || kb > 0 ? Math.min(room, window.innerHeight * 0.82) : Math.min(normal, room)) + 'px');
        if (view === 'text') scrollChat();
    }
    if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
    window.addEventListener('resize', fit);
    $('userInput').addEventListener('focus', () => { setTimeout(fit, 60); setTimeout(fit, 320); });
    $('userInput').addEventListener('blur', () => setTimeout(fit, 60));
    document.body.addEventListener('input', () => requestAnimationFrame(fit));
    requestAnimationFrame(fit);

    // hooks the Android assistant window calls
    // The phone keeps this page loaded between uses, so a new deploy would never show up. Each time the panel opens it
    // compares the site's build stamp with the one this page loaded with, and reloads itself if the site has moved on.
    let loadedStamp = null;
    const buildStamp = async () => { try { const r = await fetch('/version.json?_=' + Date.now(), { cache: 'no-store' }); const d = await r.json(); return d.build + '|' + d.builtAt; } catch (e) { return null; } };
    buildStamp().then((v) => { if (!loadedStamp) loadedStamp = v; if (v) $('buildTag').textContent = 'build ' + String(v.split('|')[0]).slice(0, 7); });   // which version of the panel this is
    async function newerSiteExists() {
        const v = await Promise.race([buildStamp(), new Promise((ok) => setTimeout(() => ok(null), 1500))]);
        if (!v) return false;
        if (!loadedStamp) { loadedStamp = v; return false; }
        return v !== loadedStamp;
    }
    window.knowuraShown = async (hasMic, resume) => {
        playEnter();
        if (resume) return; /* back from the file picker: stay exactly where we were */
        if (await newerSiteExists()) { location.reload(); return; }   // the fresh page starts itself (Android calls knowuraShown again when it has loaded)
        linkReady = refreshLink(); restore(); renderAcct(); showVoice(); orb('idle'); startCall(true);
    };
    window.knowuraHidden = () => { endCall(); stopSpeaking(); };
    // Files picked in Android's gallery / file manager / camera come back through the app, which serves them at /__kw_file/N
    // (the panel can be a brand new window by then). Fetch them, attach them, and tell Android they were received.
    window.knowuraPicked = async (n) => {
        const files = [];
        for (let i = 0; i < n; i++) {
            try {
                const r = await fetch('/__kw_file/' + i, { cache: 'no-store' });
                if (!r.ok) continue;
                const b = await r.blob();
                let name = 'file-' + (i + 1); try { name = decodeURIComponent(r.headers.get('X-Kw-Name') || name); } catch (e) { /* keep the generic name */ }
                files.push(new File([b], name, { type: b.type || r.headers.get('Content-Type') || '' }));
            } catch (e) { /* skip one that failed */ }
        }
        if (bridge && bridge.pickedDone) { try { bridge.pickedDone(); } catch (e) { /* gone */ } }
        if (view !== 'text') showText(false);
        $('textView').hidden = false; $('minBtn').hidden = false;
        if (files.length) attachCtl.add(files); else if (n > 0) toast('Couldn\'t read that file. Try again.', true);
    };
    window.knowuraNeedMic = () => { showMicCard(true); status('Microphone needed'); };

    // first paint
    playEnter();
    linkReady = refreshLink();
    restore(); renderAcct(); orb('idle');
    { const d = load('knowura_assistant_draft') || (() => { try { return localStorage.getItem('knowura_assistant_draft'); } catch (e) { return null; } })(); if (typeof d === 'string' && d && !$('userInput').value) { $('userInput').value = d; setSend(); } }
    if (!bridge) startCall(true); // in a normal browser tab, begin listening right away
    window.__kw = { showText, showVoice, openAppWithChat, exportChat, get chat() { return chat; } }; // for tests
})();
</script>
